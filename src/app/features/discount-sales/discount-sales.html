<header class="flex flex-col gap-1 border-b border-gris-rafaga p-6">
  <h1 id="ventas-descuento-titulo" class="text-xl leading-7 font-normal">
    Reporte de ventas con descuento
  </h1>
  <p class="text-sm leading-5">
    Monitorea los costos y la aplicación de descuentos para clientes Inter Pay.
  </p>
</header>

<div class="flex flex-col gap-6 p-6">
  <app-report-filters [periodo]="query.periodo()" [cedula]="query.cedula()"
    [busquedaHabilitada]="resultados.busquedaHabilitada()" [envioHabilitado]="resultados.hayResultados()"
    (consultar)="consultar($event)" (enviar)="envioAbierto.set(true)" />

  <h2 id="ventas-descuento-tabla" class="sr-only">Ventas con descuento</h2>
  <app-data-table [table]="table" [loading]="ventas.isLoading()" [skeletonRowCount]="10" density="compact"
    labelledBy="ventas-descuento-tabla">
    <div appDataTableEmpty class="contents">
      @switch (resultados.estadoVacio()) {
      @case ('error') {
      <app-error-state title="No pudimos consultar el reporte." [description]="resultados.mensajeError()"
        (retry)="ventas.reload()" />
      }
      @case ('sin-resultados') {
      <app-empty-state title="No se encontraron registros" [lines]="lineasSinResultados()" />
      }
      @default {
      <app-empty-state [lines]="['Elige un periodo para generar el reporte']" />
      }
      }
    </div>
  </app-data-table>

  <app-paginator class="self-end" ariaLabel="Paginación de ventas con descuento"
    [page]="resultados.paginadorInactivo() ? 1 : query.pagina()" [totalPages]="resultados.totalPages()"
    [disabled]="resultados.paginadorInactivo()" (pageChange)="query.goToPage($event)" />
</div>

<p class="sr-only" aria-live="polite">{{ resultados.anuncio() }}</p>

@if (query.periodo()) {
<app-send-report-dialog [open]="envioAbierto()" [request]="enviarInforme" (closed)="envioAbierto.set(false)" />
}
