<header class="flex flex-col gap-1 border-b border-gris-rafaga p-6">
  <h1 class="text-xl leading-7 font-normal">Reporte de descuentos y movilizados por cliente</h1>
  <p class="text-sm leading-5">Consulta y gestiona el detalle de los descuentos aplicados.</p>
</header>

<div class="p-6">
  <div hlmTabs [tab]="tab()" (tabActivated)="cambiarTab($event)">
    <div hlmTabsList class="w-fit" aria-label="Tipo de descuento">
      @for (item of tabs; track item.id) {
        <button [hlmTabsTrigger]="item.id">
          <!-- Reserva el ancho del texto en SemiBold (hover / seleccionada) para que la fila no salte. -->
          <span
            class="inline-flex flex-col items-center after:invisible after:h-0 after:overflow-hidden after:font-semibold after:content-[attr(data-label)]"
            [attr.data-label]="item.label"
          >
            {{ item.label }}
          </span>
        </button>
      }
    </div>

    <div hlmTabsContent="personalizados">
      @if (tab() === 'personalizados') {
        <app-personalized-discounts />
      }
    </div>
    <div hlmTabsContent="automaticos">
      @if (tab() === 'automaticos') {
        <app-automatic-discounts />
      }
    </div>
  </div>
</div>
